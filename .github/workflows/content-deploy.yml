name: Content Validation and Deploy

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: content-deploy-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.resolve_sha.outputs.commit_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Generate manifests
        run: node scripts/generate-manifests.mjs

      - name: Resolve commit SHA
        id: resolve_sha
        shell: bash
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate Markdown
    runs-on: ubuntu-latest
    needs: generate
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.generate.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Validate markdown content
        id: validate_markdown
        shell: bash
        run: |
          set +e
          node tests/validate-markdown.mjs
          VALIDATION_EXIT_CODE=$?
          echo "exit_code=${VALIDATION_EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fail job when markdown validation reports errors
        if: steps.validate_markdown.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed("Markdown validation failed. See file-level annotations above.")

