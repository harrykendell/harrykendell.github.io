<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect x="0" y="0" width="800" height="450" fill="white"/>
  <style>
    .box{fill:none;stroke:#111;stroke-width:3}
    .thin{fill:none;stroke:#111;stroke-width:2}
    .dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}
    .label{font: 20px sans-serif; fill:#111}
    .small{font: 16px sans-serif; fill:#111}
    .tiny{font: 13px sans-serif; fill:#111}
    .title{font: 28px sans-serif; font-weight:700; fill:#111}
  </style>

  <text x="30" y="45" class="title">Small delamination: inject + clamp</text>

  <!-- Skin -->
  <rect x="120" y="140" width="560" height="40" class="box"/>
  <text x="140" y="167" class="label">Outer skin</text>

  <!-- Core -->
  <rect x="120" y="180" width="560" height="120" class="dash"/>
  <text x="140" y="245" class="label">Core</text>

  <!-- Inner skin -->
  <rect x="120" y="300" width="560" height="40" class="box"/>
  <text x="140" y="327" class="label">Inner skin</text>

  <!-- Delam pocket -->
  <ellipse cx="400" cy="175" rx="120" ry="18" class="thin"/>
  <text x="410" y="120" class="small">Delam pocket</text>
  <line x1="460" y1="125" x2="450" y2="160" class="thin"/>

  <!-- Injection -->
  <line x1="300" y1="80" x2="360" y2="155" class="thin"/>
  <polygon points="360,155 345,150 355,140" fill="#111"/>
  <text x="120" y="80" class="label">Inject low-viscosity epoxy</text>

  <!-- Clamp -->
  <rect x="300" y="355" width="200" height="25" class="box"/>
  <text x="325" y="374" class="small">Release film + clamp/weight</text>
  <line x1="400" y1="355" x2="400" y2="340" class="thin"/>

  <text x="30" y="420" class="small">Goal: wet-out the pocket, restore original contour, avoid dents from over-clamping.</text>
</svg>
