<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Localized hull damage before scarf repair</title>
  <desc id="desc">Diagram showing a boat hull panel with impact cracks and crushed core zone marked for removal.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="damage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="768" height="388" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="58" fill="#0f172a" font-size="28" font-family="Arial, sans-serif" font-weight="700">
    Before: Damage Assessment
  </text>

  <path d="M80 290 C210 180, 570 185, 720 285" fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
  <path d="M80 290 C210 180, 570 185, 720 285" fill="none" stroke="url(#panel)" stroke-width="12" stroke-linecap="round"/>

  <ellipse cx="410" cy="235" rx="95" ry="52" fill="url(#damage)" opacity="0.92"/>
  <ellipse cx="410" cy="235" rx="58" ry="28" fill="#fee2e2" opacity="0.88"/>

  <path d="M360 205 L385 225 L342 244 L372 270" fill="none" stroke="#7f1d1d" stroke-width="4" stroke-linecap="round"/>
  <path d="M430 206 L452 232 L416 252 L455 271" fill="none" stroke="#7f1d1d" stroke-width="4" stroke-linecap="round"/>
  <path d="M395 198 L403 219 L381 226" fill="none" stroke="#7f1d1d" stroke-width="3" stroke-linecap="round"/>

  <line x1="570" y1="132" x2="468" y2="203" stroke="#1d4ed8" stroke-width="3"/>
  <rect x="574" y="96" width="180" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="590" y="130" fill="#1e3a8a" font-size="20" font-family="Arial, sans-serif">
    Crushed core + cracks
  </text>

  <line x1="130" y1="138" x2="324" y2="210" stroke="#0f766e" stroke-width="3"/>
  <rect x="40" y="98" width="240" height="56" rx="10" fill="#ecfeff" stroke="#99f6e4"/>
  <text x="56" y="132" fill="#134e4a" font-size="20" font-family="Arial, sans-serif">
    Mark boundary by tap test
  </text>

  <rect x="40" y="340" width="720" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="364" fill="#334155" font-size="18" font-family="Arial, sans-serif">
    Remove all damaged laminate/core to sound material before scarfing.
  </text>
</svg>
