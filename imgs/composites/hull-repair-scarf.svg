<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Prepared scarf joint area before layup</title>
  <desc id="desc">Diagram showing a tapered scarf zone with stepped ply sizes and replacement core fitted.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="768" height="388" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="58" fill="#0f172a" font-size="28" font-family="Arial, sans-serif" font-weight="700">
    After Prep: Tapered Scarf Ready for Layup
  </text>

  <path d="M80 290 C210 180, 570 185, 720 285" fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
  <path d="M80 290 C210 180, 570 185, 720 285" fill="none" stroke="url(#panel)" stroke-width="12" stroke-linecap="round"/>

  <path d="M308 257 C350 210, 468 204, 512 250 C467 295, 354 303, 308 257 Z" fill="url(#scarf)" opacity="0.95" stroke="#b45309" stroke-width="2"/>
  <path d="M350 257 C382 226, 440 226, 468 256 C440 286, 382 286, 350 257 Z" fill="url(#core)" opacity="0.95" stroke="#a16207" stroke-width="2"/>

  <path d="M324 257 C359 219, 459 214, 496 255" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-dasharray="6 6"/>
  <path d="M338 257 C369 226, 449 224, 484 255" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-dasharray="6 6"/>
  <path d="M352 257 C380 232, 439 232, 470 256" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-dasharray="6 6"/>

  <line x1="620" y1="124" x2="500" y2="232" stroke="#1d4ed8" stroke-width="3"/>
  <rect x="624" y="92" width="140" height="54" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="638" y="126" fill="#1e3a8a" font-size="20" font-family="Arial, sans-serif">
    20:1 to 50:1 taper
  </text>

  <line x1="132" y1="130" x2="360" y2="245" stroke="#0f766e" stroke-width="3"/>
  <rect x="40" y="90" width="232" height="56" rx="10" fill="#ecfeff" stroke="#99f6e4"/>
  <text x="56" y="124" fill="#134e4a" font-size="20" font-family="Arial, sans-serif">
    Replacement core bonded
  </text>

  <rect x="40" y="340" width="720" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="364" fill="#334155" font-size="18" font-family="Arial, sans-serif">
    Use stepped plies from largest to smallest, then vacuum bag and cure.
  </text>
</svg>
