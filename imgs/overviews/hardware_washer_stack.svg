<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect x="0" y="0" width="800" height="450" fill="white"/>
  <style>
    .box{fill:none;stroke:#111;stroke-width:3}
    .thin{fill:none;stroke:#111;stroke-width:2}
    .dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}
    .label{font: 20px sans-serif; fill:#111}
    .small{font: 16px sans-serif; fill:#111}
    .tiny{font: 13px sans-serif; fill:#111}
    .title{font: 28px sans-serif; font-weight:700; fill:#111}
  </style>

  <text x="30" y="45" class="title">Safe washer stack against composite</text>

  <!-- Bolt -->
  <rect x="160" y="120" width="120" height="60" class="box"/>
  <text x="185" y="155" class="label">Bolt head</text>
  <rect x="205" y="180" width="30" height="210" class="box"/>

  <!-- Stack -->
  <rect x="120" y="205" width="200" height="20" class="box"/>
  <text x="340" y="222" class="label">Flat washer</text>

  <rect x="120" y="230" width="200" height="70" class="box"/>
  <text x="340" y="270" class="label">Hull / rigger</text>

  <rect x="120" y="305" width="200" height="20" class="box"/>
  <text x="340" y="322" class="label">Flat washer</text>

  <rect x="130" y="330" width="180" height="18" class="thin"/>
  <text x="340" y="345" class="small">(Optional) lock washer / spring</text>

  <rect x="150" y="352" width="140" height="35" class="box"/>
  <text x="340" y="378" class="label">Nyloc / nut</text>

  <text x="30" y="90" class="small">Rule: never place split/spring washers directly on composite. Always use a flat washer against the hull.</text>
</svg>
