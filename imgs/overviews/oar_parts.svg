<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect x="0" y="0" width="800" height="450" fill="white"/>
  <style>
    .box{fill:none;stroke:#111;stroke-width:3}
    .thin{fill:none;stroke:#111;stroke-width:2}
    .dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 6}
    .label{font: 20px sans-serif; fill:#111}
    .small{font: 16px sans-serif; fill:#111}
    .tiny{font: 13px sans-serif; fill:#111}
    .title{font: 28px sans-serif; font-weight:700; fill:#111}
  </style>

  <text x="30" y="45" class="title">Oar parts and terms</text>

  <!-- Shaft -->
  <line x1="100" y1="260" x2="680" y2="260" class="box"/>
  <rect x="90" y="235" width="60" height="50" class="box"/>
  <text x="85" y="220" class="label">Handle</text>
  <line x1="120" y1="235" x2="120" y2="160" class="thin"/>
  <text x="65" y="150" class="small">Grip / suede</text>

  <!-- Sleeve -->
  <rect x="320" y="235" width="120" height="50" class="box"/>
  <text x="330" y="220" class="label">Sleeve</text>

  <!-- Collar -->
  <rect x="450" y="235" width="30" height="50" class="box"/>
  <text x="430" y="315" class="label">Collar</text>
  <line x1="465" y1="285" x2="455" y2="305" class="thin"/>

  <!-- Blade -->
  <path d="M680 260 Q760 235 740 170 Q720 120 650 150 Q620 165 630 205 Q635 240 680 260 Z" class="box"/>
  <text x="660" y="115" class="label">Spoon / blade</text>
  <line x1="690" y1="125" x2="680" y2="165" class="thin"/>

  <!-- Inboard/outboard -->
  <line x1="465" y1="340" x2="120" y2="340" class="dash"/>
  <polygon points="120,340 135,332 135,348" fill="#111"/>
  <polygon points="465,340 450,332 450,348" fill="#111"/>
  <text x="240" y="335" class="label">Inboard</text>

  <line x1="465" y1="370" x2="720" y2="370" class="dash"/>
  <polygon points="465,370 480,362 480,378" fill="#111"/>
  <polygon points="720,370 705,362 705,378" fill="#111"/>
  <text x="545" y="365" class="label">Outboard</text>

  <text x="30" y="420" class="small">Sleeve orientation sets pitch. Collar position sets inboard. Record changes and keep pairs matched.</text>
</svg>
